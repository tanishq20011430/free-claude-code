name: gh-secret-kit-migrate
on:
  pull_request:
    types:
      - labeled
jobs:
  migrate-secrets:
    if: github.event.label.name == 'gh-secret-kit-migrate'
    runs-on: gh-secret-kit-migrate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
    env:
      GH_HOST: github.com
